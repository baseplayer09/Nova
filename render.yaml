services:
  - type: web
    name: nova-backend
    runtime: node
    plan: free
    rootDir: Nova/backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: cloudflare
      - key: CORS_ORIGIN
        value: "*"
